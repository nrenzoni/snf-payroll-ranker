schema: spec-driven

# Project context
context: |
  Tech Stack: Python 3.13, Polars, NumPy, scikit-learn, Lets-Plot, Jupytext, UV, Ruff, Pyrefly.
  Workflow: Jupytext script files (.py) are source of truth for notebooks; do not edit .ipynb artifacts directly.
  Architecture: Synthetic payroll anomaly ranking pipeline with typed result objects, Polars-first data processing, leakage-safe feature engineering, model scoring, diagnostics, review queues, and notebook narratives.
  Coding Standard: Prefer strict type safety, named dataclass result objects, explicit schema references, and high-performance Polars/NumPy operations over loose dicts, tuples, or row-wise Python callbacks.

# Per-artifact rules
rules:
  design:
    - "Architecture: Keep pipeline stages explicit: data generation, validation, features, rules, scoring, evaluation, explainability, diagnostics, queue simulation, and presentation."
    - "API Boundaries: Public functions that return multiple values must return named dataclass result objects, not raw tuples or dict[str, object]."
    - "Compatibility: Do not add backward-compatible mapping or tuple-unpack shims unless the user explicitly asks for compatibility."
    - "DataFrames: Keep tabular payloads as Polars DataFrames. Use typed dataclasses to group related DataFrames."
    - "Performance: Push transformations into Polars expressions or NumPy batch operations. Avoid to_dicts(), iter_rows(), map_elements(), and row-wise Python loops in hot paths unless unavoidable and justified."
    - "Typing: New code must pass Pyrefly with zero errors. Prefer attribute access such as results.scored and generated.payroll over results['scored'] or positional unpacking."
    - "Schema: Use column enums/constants from columns.py for all payroll, feature, rule, score, metric, aggregate, and review columns."

  specs:
    - "Documentation: Maintain RESEARCH_LOG.md at the root when research decisions or benchmark findings influence implementation."
    - "Behavior: Specs should describe typed return contracts for new public APIs."
    - "Validation: Specs should include expected prek verification, plus pytest when behavior or test-covered code changes."

  tasks:
    # --- Python & Type Safety Rules ---
    - "Use Python 3.13 syntax and modern type annotations."
    - "Return named dataclass result objects for multi-value returns; do not return untyped dict[str, object] or raw positional tuples from public APIs."
    - "Do not implement __getitem__, keys(), __contains__, or __iter__ compatibility on result dataclasses unless explicitly requested."
    - "Use result.attribute access consistently, e.g. results.scored, generated.labels, validation.failures, rolling.metrics."
    - "Use TypedDict only when mapping semantics are required; otherwise prefer dataclasses."
    - "Avoid Any except at unavoidable third-party or dynamic-library boundaries, and keep it localized."
    - "Run prek run --all-files after code or notebook changes and resolve all reported issues before completion."

    # --- Polars & Data Processing Rules ---
    - "Never use pandas. If a snippet requires dataframes, use Polars (pl)."
    - "Column Name Enforcement: Do not use raw strings for project schema columns. Use enums/constants from columns.py."
    - "Prefer Polars expressions, group_by, joins, windows, and vectorized NumPy over Python row loops."
    - "Avoid DataFrame.to_dicts(), iter_rows(named=True), and pl.map_elements() in performance-sensitive paths."
    - "If row dict processing is unavoidable, isolate it in small helpers with typed casts and explain why."
    - "Construct DataFrames with explicit schemas or immediate casts when records are heterogeneous or exported."
    - "Do not parse semicolon-delimited strings as structured data. Preserve structured values until final presentation/export boundaries."

    # --- Visualization Rules ---
    - "Never use matplotlib. Use Lets-Plot for visualizations."
    - "Prefer the Grammar of Graphics approach, e.g. ggplot(data, aes(...)) + geom_point()."
    - "Keep Lets-Plot conversion isolated at presentation boundaries. If Lets-Plot typing is incomplete, use localized import adapters rather than weakening project-wide typing."
    - "Standardize plot themes with theme_minimal() unless a specific notebook narrative requires otherwise."

    # --- File & System Rules ---
    - "Target changes: Always apply code modifications to the Jupytext .py files, not .ipynb artifacts."
    - "Do not commit generated __pycache__, notebook outputs, or transient benchmark artifacts."
    - "Use prek run --all-files as the standard post-change verification gate; it runs YAML checks, file fixers, Ruff, formatting, and Pyrefly."
    - "Run uv run pytest when changes affect runtime behavior, pipeline logic, diagnostics, or test-covered code paths."

    # --- Documentation/Style Rules ---
    - "Docstrings: Use numpydoc style for public functions and dataclasses when behavior is not self-evident."
    - "Use clear, descriptive variable names for intermediate steps."
    - "Keep comments rare and focused on non-obvious business logic, leakage prevention, or performance tradeoffs."

  proposal:
    - "Focus on typed API contracts, schema safety, leakage prevention, and estimated performance impact."
    - "Call out whether a proposed change intentionally breaks compatibility."
    - "Include verification tasks for prek run --all-files, and pytest when relevant."
