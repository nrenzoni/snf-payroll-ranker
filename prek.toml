exclude = "(^|/)\\.ipynb_checkpoints/"

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
]

[[repos]]
repo = "https://github.com/asottile/add-trailing-comma"
rev = "v4.0.0"
hooks = [
  { id = "add-trailing-comma" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.12"
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "local"
hooks = [
    {
      id = "jupytext-test-strict",
      name = "jupytext strict notebook roundtrip",
      language = "system",
      entry = "uv run jupytext --to ipynb --test-strict",
      files = "^notebooks/(snf_payroll_ranker_report|legacy/.*)\\.py$",
      pass_filenames = true,
    },
    { 
      id = "pyrefly", 
      name = "pyrefly", 
      language = "system", 
      entry = "uv run pyrefly check --min-severity warn",
      types_or = ["python", "pyi"],
    }
]
