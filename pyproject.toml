[project]
name = "payroll-anomaly-ranking"
version = "0.1.0"
description = "SNF payroll ranking and review prioritization project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.6.0",
    "numpy>=2.3.5",
    "polars>=1.35.1",
    "scikit-learn>=1.7.2",
]

[project.optional-dependencies]
notebooks = [
    "graphviz>=0.21",
    "ipykernel>=7.2.0",
    "itables>=2.7.3",
    "jupyterlab>=4.5.7",
    "jupytext>=1.19.1",
    "lets-plot>=4.9.0",
    "nbconvert>=7.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payroll_anomaly_ranking"]

[dependency-groups]
dev = [
    "payroll-anomaly-ranking[notebooks]",
    "prek>=0.4.1",
    "pyrefly>=0.64.0",
    "pytest>=9.0.1",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "smoke: fast post-change sanity checks",
    "integration: broader pipeline, scenario, and diagnostic tests",
    "slow: expensive scenario, diagnostic, or notebook execution tests",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"] # Error, Pyflakes, Isort, Upgrade
ignore = ["E501"] # Line too long

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pyrefly]
search-path = ["src", "notebooks"]
project-includes = [
    "**/*.py*",
]
project-excludes = [
    "**/.ipynb_checkpoints/**",
    "jupyter_nbconvert_config.py",
]
