[project]
name = "payroll-anomaly-ranking"
version = "0.1.0"
description = "payroll anomaly detection and ranked review system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "jupytext>=1.19.1",
    "lets-plot>=4.9.0",
    "nbconvert>=7.16.6",
    "numpy>=2.3.5",
    "polars>=1.35.1",
    "scikit-learn>=1.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payroll_anomaly_ranking"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.7",
    "jupytext>=1.19.1",
    "lets-plot>=4.9.0",
    "pytest>=9.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
